name: "Packaging Test"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  check_packaging:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Packaging Test
        run: |
          uv build
          uv publish --dry-run
