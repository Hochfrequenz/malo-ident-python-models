name: "Linting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  pylint:
    name: "Python Code Quality and Lint (${{ matrix.python-version }}, ${{ matrix.os }}, ${{ matrix.group }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest]
        include:
          - group: linting
            commands: |
              uv run pylint --ignore=_autogenerated.py maloident
              uv run pylint unittests --rcfile=unittests/.pylintrc
          - group: type_check
            commands: |
              uv run mypy --show-error-codes src/maloident --strict
              uv run mypy --show-error-codes unittests --strict
          - group: spell_check
            commands: |
              uv run codespell --ignore-words=domain-specific-terms.txt src
              uv run codespell --ignore-words=domain-specific-terms.txt README.md
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: uv sync --group ${{ matrix.group }}
      - name: Run ${{ matrix.group }}
        run: ${{ matrix.commands }}
