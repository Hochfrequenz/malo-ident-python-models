name: "Linting"

on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  lint:
    name: "Python Code Quality and Lint (${{ matrix.python-version }}, ${{ matrix.os }}, ${{ matrix.group }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - python-version: "3.13"
            os: ubuntu-latest
            group: linting
            commands: |
              uv run ruff check src/maloident unittests --exclude src/maloident/v1/_autogenerated.py
          - python-version: "3.13"
            os: ubuntu-latest
            group: type_check
            commands: |
              uv run mypy --show-error-codes src/maloident --strict
              uv run mypy --show-error-codes unittests --strict
          - python-version: "3.13"
            os: ubuntu-latest
            group: spell_check
            commands: |
              uv run codespell --ignore-words=domain-specific-terms.txt src
              uv run codespell --ignore-words=domain-specific-terms.txt README.md
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: uv sync --group ${{ matrix.group }}
      - name: Run ${{ matrix.group }}
        run: ${{ matrix.commands }}
