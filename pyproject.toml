[project]
name = "maloident"
description = "Model classes for the Marktlokation ID Identification API by EDI@Energy (manually fixed)"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "your name", email = "info+github@hochfrequenz.de" }]
keywords = ["MaLo Ident", "Marktlokation", "BDEW", "MaLo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["pydantic>=2"] # add all the dependencies here
dynamic = ["readme", "version"]

[project.urls]
Changelog = "https://github.com/Hochfrequenz/malo-ident-python-models/releases"
Homepage = "https://github.com/Hochfrequenz/malo-ident-python-models"

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "N", "PL", "RUF"]
ignore = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "PLR2004", # magic-value-comparison
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]

[mypy]
truethy-bool = true

[tool.mypy]
disable_error_code = []

[[tool.mypy.overrides]]
module = "maloident.v1._autogenerated"
ignore_errors = true


[dependency-groups]
tests = ["pytest==8.4.2"]
linting = [
    "ruff==0.16.2",
    { include-group = "tests" },
]
type_check = ["mypy[pydantic]==1.19.1", { include-group = "tests" }]
spell_check = ["codespell==2.4.3"]
coverage = ["coverage==7.15.3; python_version >= '3.10'", { include-group = "tests" }]
codegen = ["datamodel-code-generator==0.71.0; python_version >= '3.10'", { include-group = "linting" }]
dev = [
    "pre-commit",
    { include-group = "tests" },
    { include-group = "linting" },
    { include-group = "type_check" },
    { include-group = "coverage" },
    { include-group = "spell_check" },
]

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling>=1.8.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_maloident_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.sdist]
exclude = ["/unittests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
